{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>거래 수정</h1><p>{{t.name}} · {{t.symbol}}</p><form method="post" class="formgrid"><label>거래일<input name="trade_date" type="date" value="{{t.trade_date}}" required></label><label>구분<select name="side"><option value="BUY" {{'selected' if t.side=='BUY'}}>매수</option><option value="SELL" {{'selected' if t.side=='SELL'}}>매도</option></select></label><label>수량<input name="qty" type="number" step="0.000001" value="{{t.qty}}" required></label><label>체결가<input name="price" type="number" step="0.0001" value="{{t.price}}" required></label><label>수수료<input name="fee" type="number" step="0.01" value="{{t.fee}}"></label><label>메모<input name="note" value="{{t.note or ''}}"></label><button class="primary wide">수정 저장</button></form></section>{% endblock %}
