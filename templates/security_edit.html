{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>종목 수정</h1><form method="post" class="formgrid"><label>계좌명<input name="account_name" value="{{sec.account_name}}" required></label><label>시장<select name="market"><option value="KR" {{'selected' if sec.market=='KR'}}>국내</option><option value="US" {{'selected' if sec.market=='US'}}>미국</option></select></label><label>종목코드<input name="symbol" value="{{sec.symbol}}" required></label><label>종목명<input name="name" value="{{sec.name}}" required></label><label>통화<select name="currency"><option value="KRW" {{'selected' if sec.currency=='KRW'}}>KRW</option><option value="USD" {{'selected' if sec.currency=='USD'}}>USD</option></select></label><label>자동조회 심볼<input name="quote_symbol" value="{{sec.quote_symbol or ''}}"></label><label>현재가<input name="current_price" type="number" step="0.0001" value="{{sec.current_price}}"></label><button class="primary wide">저장</button></form></section>{% endblock %}
