{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>{{c.week_no}}주차 수정</h1><form method="post" class="formgrid"><label>주차<input name="week_no" type="number" min="0" value="{{c.week_no}}"></label><label>기준일<input id="closeDateInput" name="close_date" type="date" value="{{c.close_date}}" onchange="fetchQuoteByDate()"></label><label>V값<input name="v_value" type="number" step="0.0001" value="{{c.v_value}}"></label><label>G<input name="g_value" type="number" step="0.0001" value="{{c.g_value}}"></label><label>TQQQ 종가 <small id="priceStatus">기준일 종가</small><div class="inline"><input id="priceInput" name="close_price" type="number" step="0.0001" value="{{c.close_price}}" readonly><button type="button" class="sub" onclick="fetchQuoteByDate()">자동조회</button><button type="button" class="sub" onclick="toggleManualPrice()">수동입력</button></div></label><label>배당<input name="dividend" type="number" step="0.01" value="{{c.dividend}}"></label><label>V최소<input name="v_min" type="number" step="0.0001" value="{{c.v_min}}"></label><label>V최대<input name="v_max" type="number" step="0.0001" value="{{c.v_max}}"></label><label>다음 추가금<input name="contribution" type="number" step="0.01" value="{{c.contribution}}"></label><label>메모<input name="note" value="{{c.note or ''}}"></label><button class="primary wide">수정 저장</button></form></section>{% endblock %}{% block script %}<script src="{{url_for('static',filename='app.js')}}"></script>{% endblock %}
