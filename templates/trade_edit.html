{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>{{t.week_no}}주차 매매 수정</h1><form method="post" class="formgrid"><label>구분<select name="side"><option value="BUY" {{'selected' if t.side=='BUY'}}>매수</option><option value="SELL" {{'selected' if t.side=='SELL'}}>매도</option></select></label><label>수량<input name="qty" type="number" step="0.0001" value="{{t.qty}}"></label><label>체결가<input name="price" type="number" step="0.0001" value="{{t.price}}"></label><label>수수료<input name="fee" type="number" step="0.01" value="{{t.fee}}"></label><label class="wide">메모<input name="note" value="{{t.note or ''}}"></label><button class="primary wide">수정 저장</button></form></section>{% endblock %}
