{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>배당기록 수정</h1><form method="post" class="formgrid"><label>지급일<input name="pay_date" type="date" value="{{d.pay_date}}" required></label><label>종목<select name="security_id">{% for s in securities %}<option value="{{s.id}}" {{'selected' if s.id==d.security_id}}>[{{s.account_name}}] {{s.name}} · {{s.symbol}}</option>{% endfor %}</select></label><label>보유수량<input name="shares" type="number" step="0.000001" value="{{d.shares}}"></label><label>주당배당<input name="per_share" type="number" step="0.0001" value="{{d.per_share}}"></label><label>세전<input name="gross" type="number" step="0.01" value="{{d.gross}}"></label><label>세금<input name="tax" type="number" step="0.01" value="{{d.tax}}"></label><label>세후<input name="net" type="number" step="0.01" value="{{d.net}}"></label><label>메모<input name="note" value="{{d.note or ''}}"></label><button class="primary wide">수정 저장</button></form></section>{% endblock %}
